<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Sayfa Bulunamadı | Virex Media</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
            --primary: #06b6d4;
            --secondary: #d946ef;
            --bg: #0b0f1a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --gradient: linear-gradient(135deg, #06b6d4, #d946ef);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        /* animated bg blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: drift 8s ease-in-out infinite;
            pointer-events: none;
        }
        .blob-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
        .blob-2 { width: 350px; height: 350px; background: var(--secondary); bottom: -100px; right: -80px; animation-delay: -4s; }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50%       { transform: translate(30px, 40px); }
        }

        /* grid overlay */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(6,182,212,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,.04) 1px, transparent 1px);
            background-size: 56px 56px;
            pointer-events: none;
        }

        .content { position: relative; z-index: 1; max-width: 560px; }

        .logo-wrap { margin-bottom: 40px; }
        .logo-wrap img { height: 48px; width: auto; }

        .code-number {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 800;
            line-height: 1;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: pulse404 3s ease-in-out infinite;
        }
        @keyframes pulse404 {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.8; }
        }

        h1 {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }
        p {
            font-size: 1rem;
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .btns {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 28px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }
        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 8px 24px rgba(6,182,212,0.35);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(6,182,212,0.5); }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.15);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--primary); transform: translateY(-2px); }

        .countdown {
            margin-top: 48px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .countdown span { color: var(--primary); font-weight: 700; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="content">
        <div class="logo-wrap">
            <a href="/"><img src="images/virex-logo-v3.png" alt="Virex Media"></a>
        </div>

        <div class="code-number">404</div>
        <h1>Bu sayfa bulunamadı.</h1>
        <p>Aradığınız sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir.<br>Endişelenmeyin — sizi doğru yere yönlendirelim.</p>

        <div class="btns">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Ana Sayfaya Dön
            </a>
            <a href="https://t.me/uzay_virex" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                <i class="fab fa-telegram-plane"></i> Bize Yazın
            </a>
        </div>

        <p class="countdown"><span id="sec">10</span> saniye içinde ana sayfaya yönlendiriliyorsunuz.</p>
    </div>

    <script>
        let s = 10;
        const el = document.getElementById('sec');
        const t = setInterval(() => {
            s--;
            if (el) el.textContent = s;
            if (s <= 0) { clearInterval(t); window.location.href = '/'; }
        }, 1000);
    </script>
</body>
</html>
